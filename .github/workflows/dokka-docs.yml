name: Generate Documentation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  dokka:
    name: Build Dokka Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          
      - name: Grant Execute Permission
        run: chmod +x gradlew
        
      - name: Generate Dokka Documentation
        run: |
          echo "📚 Generating documentation for all modules..."
          ./gradlew dokkaHtml --no-daemon
          
      - name: Collect Documentation
        run: |
          mkdir -p docs
          # Copy all module documentation
          find . -path "*/build/dokka/html" -type d | while read dir; do
            module=$(echo $dir | sed 's|./||' | sed 's|/build/dokka/html||' | tr '/' '-')
            echo "Copying docs for: $module"
            mkdir -p "docs/$module"
            cp -r "$dir/"* "docs/$module/" 2>/dev/null || true
          done
          
      - name: Create Documentation Index
        run: |
          cat > docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>Android Code Challenge - Documentation</title>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
                      line-height: 1.6;
                      color: #333;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      min-height: 100vh;
                      padding: 20px;
                  }
                  .container {
                      max-width: 1200px;
                      margin: 0 auto;
                      background: white;
                      border-radius: 12px;
                      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
                      overflow: hidden;
                  }
                  .header {
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      color: white;
                      padding: 60px 40px;
                      text-align: center;
                  }
                  .header h1 {
                      font-size: 3em;
                      margin-bottom: 10px;
                      font-weight: 700;
                  }
                  .header p {
                      font-size: 1.2em;
                      opacity: 0.9;
                  }
                  .content {
                      padding: 40px;
                  }
                  .modules {
                      display: grid;
                      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                      gap: 20px;
                      margin-top: 30px;
                  }
                  .module-card {
                      background: #f8f9fa;
                      border-radius: 8px;
                      padding: 25px;
                      transition: all 0.3s ease;
                      border: 2px solid transparent;
                  }
                  .module-card:hover {
                      transform: translateY(-5px);
                      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
                      border-color: #667eea;
                  }
                  .module-card h3 {
                      color: #667eea;
                      margin-bottom: 10px;
                      font-size: 1.4em;
                  }
                  .module-card p {
                      color: #666;
                      margin-bottom: 15px;
                  }
                  .module-card a {
                      display: inline-block;
                      background: #667eea;
                      color: white;
                      padding: 10px 20px;
                      border-radius: 5px;
                      text-decoration: none;
                      transition: background 0.3s;
                  }
                  .module-card a:hover {
                      background: #764ba2;
                  }
                  .section {
                      margin: 40px 0;
                  }
                  .section h2 {
                      color: #333;
                      margin-bottom: 20px;
                      padding-bottom: 10px;
                      border-bottom: 3px solid #667eea;
                  }
                  .badge {
                      display: inline-block;
                      background: #667eea;
                      color: white;
                      padding: 5px 15px;
                      border-radius: 20px;
                      font-size: 0.9em;
                      margin: 5px;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <div class="header">
                      <h1>📚 Android Code Challenge</h1>
                      <p>Complete API Documentation</p>
                  </div>
                  <div class="content">
                      <div class="section">
                          <h2>🏗️ Location App Modules</h2>
                          <div class="modules">
                              <div class="module-card">
                                  <h3>📱 App Module</h3>
                                  <p>Presentation layer with MVVM pattern, UI components, and ViewModels</p>
                                  <a href="location-app/index.html">View Docs →</a>
                              </div>
                              <div class="module-card">
                                  <h3>💾 Data Module</h3>
                                  <p>Room database, encrypted storage with SQLCipher, and repositories</p>
                                  <a href="location-data/index.html">View Docs →</a>
                              </div>
                              <div class="module-card">
                                  <h3>🎯 Domain Module</h3>
                                  <p>Business logic, use cases, and repository interfaces</p>
                                  <a href="location-domain/index.html">View Docs →</a>
                              </div>
                              <div class="module-card">
                                  <h3>🔄 Service Module</h3>
                                  <p>Background GPS collection service with foreground notification</p>
                                  <a href="location-service/index.html">View Docs →</a>
                              </div>
                          </div>
                      </div>

                      <div class="section">
                          <h2>🌐 Internet App Modules</h2>
                          <div class="modules">
                              <div class="module-card">
                                  <h3>📱 App Module</h3>
                                  <p>MVI pattern presentation layer with Compose UI</p>
                                  <a href="internet-app/index.html">View Docs →</a>
                              </div>
                              <div class="module-card">
                                  <h3>💾 Data Module</h3>
                                  <p>IPC repositories for broadcast and ContentProvider communication</p>
                                  <a href="internet-data/index.html">View Docs →</a>
                              </div>
                              <div class="module-card">
                                  <h3>🎯 Domain Module</h3>
                                  <p>Use cases for service control and location queries</p>
                                  <a href="internet-domain/index.html">View Docs →</a>
                              </div>
                          </div>
                      </div>

                      <div class="section">
                          <h2>🔧 Core Modules</h2>
                          <div class="modules">
                              <div class="module-card">
                                  <h3>🔒 Security</h3>
                                  <p>AES-256 encryption, Android KeyStore management</p>
                                  <a href="core-security/index.html">View Docs →</a>
                              </div>
                              <div class="module-card">
                                  <h3>🔗 IPC</h3>
                                  <p>Inter-process communication contracts and models</p>
                                  <a href="core-ipc/index.html">View Docs →</a>
                              </div>
                              <div class="module-card">
                                  <h3>🛠️ Common</h3>
                                  <p>Shared utilities, error handling, and result types</p>
                                  <a href="core-common/index.html">View Docs →</a>
                              </div>
                          </div>
                      </div>

                      <div class="section">
                          <h2>📊 Technology Stack</h2>
                          <div>
                              <span class="badge">Kotlin 2.2.20</span>
                              <span class="badge">Clean Architecture</span>
                              <span class="badge">MVVM</span>
                              <span class="badge">MVI</span>
                              <span class="badge">Hilt</span>
                              <span class="badge">Koin</span>
                              <span class="badge">Room + SQLCipher</span>
                              <span class="badge">Coroutines</span>
                              <span class="badge">Flow</span>
                              <span class="badge">Jetpack Compose</span>
                          </div>
                      </div>
                  </div>
              </div>
          </body>
          </html>
          EOF
          
      - name: Upload Documentation
        uses: actions/upload-artifact@v4
        with:
          name: dokka-documentation
          path: docs/
          retention-days: 90
          
      - name: Deploy to GitHub Pages
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: .
          keep_files: false
          
      - name: Add Summary
        if: success()
        run: |
          echo "## 📚 Documentation Generated Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All modules documented" >> $GITHUB_STEP_SUMMARY
          echo "📊 Total modules: 10" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Modules:" >> $GITHUB_STEP_SUMMARY
          echo "- Location App (app, data, domain, service)" >> $GITHUB_STEP_SUMMARY
          echo "- Internet App (app, data, domain)" >> $GITHUB_STEP_SUMMARY
          echo "- Core (security, ipc, common)" >> $GITHUB_STEP_SUMMARY
