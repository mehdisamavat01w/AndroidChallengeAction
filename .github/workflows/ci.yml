name: Android CI/CD

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: android-build
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - run: chmod +x gradlew

      - run: ./gradlew clean

      - run: ./gradlew :location:app:assembleDebug :internet:app:assembleDebug --stacktrace --no-daemon --max-workers=2

      - run: ./gradlew test --stacktrace --no-daemon --max-workers=2

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-files
          path: |
            location/app/build/outputs/apk/debug/*.apk
            internet/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: android-lint
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - run: chmod +x gradlew

      - run: ./gradlew lintDebug --stacktrace --no-daemon --max-workers=2 || true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-results*.html'
          retention-days: 7
