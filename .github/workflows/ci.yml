name: Android CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --continue

      - name: Generate test report
        if: always()
        run: |
          echo "Test execution completed"
          find . -path "*/build/test-results/testDebugUnitTest/*.xml" -type f

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/build/test-results/testDebugUnitTest/
            **/build/reports/tests/testDebugUnitTest/
          retention-days: 30

      - name: Build Location App
        run: ./gradlew :location:app:assembleDebug --stacktrace

      - name: Build Internet App
        run: ./gradlew :internet:app:assembleDebug --stacktrace

      - name: Upload Location APK
        uses: actions/upload-artifact@v4
        with:
          name: location-app-debug
          path: location/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Internet APK
        uses: actions/upload-artifact@v4
        with:
          name: internet-app-debug
          path: internet/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run lint checks
        run: ./gradlew lintDebug --stacktrace --continue

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
          retention-days: 14

  test-report:
    name: Test Report Summary
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()

    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results

      - name: Display test summary
        run: |
          echo "=== Test Results Summary ==="
          find test-results -name "*.xml" -type f | wc -l | xargs echo "Test result files found:"
          echo "=============================="
